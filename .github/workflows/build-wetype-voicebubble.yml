name: Build WeType VoiceBubble APK

on:
  push:
    branches:
      - build-wetype-voicebubble-20260820
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify source tree
        run: |
          test -f wetype_voicebubble/settings.gradle
          test -f wetype_voicebubble/app/src/main/AndroidManifest.xml
          test -f wetype_voicebubble/app/src/main/java/com/wetype/voicebubble/BubbleAccessibilityService.java

      - name: Build debug APK
        working-directory: wetype_voicebubble
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeTypeVoiceBubble-debug-apk
          path: wetype_voicebubble/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
